name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "19 3 * * 1"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  offline:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v0.12.6
            asset: nvim-linux-x86_64
            sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
            experimental: false
          - version: nightly
            asset: nvim-linux-x86_64
            # A moving nightly cannot have a stable pin; do not reuse a stale hash.
            sha256: ''
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned Neovim
        run: |
          set -euo pipefail
          mkdir -p /tmp/nvim-zh-ci
          curl -fsSL --retry 3 "https://github.com/neovim/neovim/releases/download/${{ matrix.version }}/${{ matrix.asset }}.tar.gz" -o /tmp/nvim-zh-ci/nvim.tar.gz
          if [[ -n "${{ matrix.sha256 }}" ]]; then
            printf '%s  %s\n' '${{ matrix.sha256 }}' /tmp/nvim-zh-ci/nvim.tar.gz | sha256sum -c -
          else
            echo 'NVIM_ARCHIVE_SHA256=SKIP reason=mutable_nightly_no_stable_official_digest'
          fi
          tar -xzf /tmp/nvim-zh-ci/nvim.tar.gz -C /tmp/nvim-zh-ci
          echo "/tmp/nvim-zh-ci/${{ matrix.asset }}/bin" >> "$GITHUB_PATH"
      - name: Install gettext and terminal test dependencies
        run: |
          if ! command -v msgfmt >/dev/null || ! pkg-config --exists vterm; then
            sudo apt-get update
            sudo apt-get install -y gettext libvterm-dev pkg-config
          fi
      - name: Syntax, catalogs, resources, offline suites and release gates
        run: make check-syntax check-translations check-native check-resources check-reproducible test release-check
      - name: Probe Linux Help and SDK 2 snapshots
        if: ${{ !matrix.experimental }}
        run: |
          source tests/run/lib/env.sh
          NVIM_ZH_PLATFORM_NATIVE=ok run_lua "$NVIM_ZH_ROOT/tests/platform/localization.lua"
          run_lua "$NVIM_ZH_ROOT/tests/platform/packs.lua"
      - name: CI compatibility evidence
        run: nvim --version | head -n 3

  upstream-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Neovim 0.12.6
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          printf '%s  %s\n' '474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87' /tmp/nvim.tar.gz | sha256sum -c -
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo /tmp/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Install terminal and debug test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libvterm-dev ripgrep unzip
      - name: Install CodeLLDB 1.12.3
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/vadimcn/codelldb/releases/download/v1.12.3/codelldb-linux-x64.vsix -o /tmp/codelldb.vsix
          printf '%s  %s\n' '1cd7f386598022b51a5b93b9ffa23e812b23f519cfe1833384ec4bef4bfd1be1' /tmp/codelldb.vsix | sha256sum -c -
          unzip -q /tmp/codelldb.vsix -d /tmp/nvim-zh-codelldb
          chmod +x /tmp/nvim-zh-codelldb/extension/adapter/codelldb
          echo /tmp/nvim-zh-codelldb/extension/adapter >> "$GITHUB_PATH"
      - name: Fetch manifest-pinned upstream archives
        run: |
          python3 tools/adapter_tool.py lock all --json > /tmp/nvim-zh-adapter-lock.json
          python3 tools/adapter_tool.py fetch --lock /tmp/nvim-zh-adapter-lock.json --source-root /tmp/nvim-zh-smoke
      - name: Run fixed upstream contracts and full TUI matrix
        run: make test-upstream
        env:
          NVIM_ZH_ADAPTER_SOURCE_ROOT: /tmp/nvim-zh-smoke
          NVIM_ZH_ADAPTER_REPORT: /tmp/nvim-zh-upstream-report.json
      - name: Upload adapter test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adapter-upstream-evidence
          path: /tmp/nvim-zh-upstream-report.json
      - name: Resolve, audit, and test upstream candidates
        if: github.event_name == 'schedule'
        run: |
          python3 tools/adapter_tool.py watch --source-root /tmp/nvim-zh-smoke \
            --report-dir /tmp/nvim-zh-candidates --test
      - name: Upload candidate source and catalog audit
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adapter-upstream-candidates
          path: /tmp/nvim-zh-candidates
