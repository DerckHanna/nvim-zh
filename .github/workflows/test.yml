name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: v0.12.6
            asset: nvim-linux-x86_64
            sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
            experimental: false
          - version: nightly
            asset: nvim-linux-x86_64
            # A moving nightly cannot have a stable pin; do not reuse a stale hash.
            sha256: ''
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Official refs/tags/v4 and v4.4.0 resolve to this commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Official refs/tags/v5 and v5.6.0 resolve to this commit.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Neovim
        run: |
          set -euo pipefail
          mkdir -p /tmp/nvim-zh-ci
          curl -fsSL --retry 3 "https://github.com/neovim/neovim/releases/download/${{ matrix.version }}/${{ matrix.asset }}.tar.gz" -o /tmp/nvim-zh-ci/nvim.tar.gz
          if [[ -n "${{ matrix.sha256 }}" ]]; then
            printf '%s  %s\n' '${{ matrix.sha256 }}' /tmp/nvim-zh-ci/nvim.tar.gz | sha256sum -c -
          else
            echo 'NVIM_ARCHIVE_SHA256=SKIP reason=mutable_nightly_no_stable_official_digest'
          fi
          tar -xzf /tmp/nvim-zh-ci/nvim.tar.gz -C /tmp/nvim-zh-ci
          echo "/tmp/nvim-zh-ci/${{ matrix.asset }}/bin" >> "$GITHUB_PATH"
      - name: Install gettext for native MO verification
        if: matrix.version == 'v0.12.6'
        run: |
          if ! command -v msgfmt >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext
          fi
      - name: Syntax, catalogs, resources, offline suites and release gates
        run: make check-syntax check-translations check-native check-resources check-reproducible test release-check
      - name: CI compatibility evidence
        run: nvim --version | head -n 3

  upstream-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Official refs/tags/v4 and v4.4.0 resolve to this commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Official refs/tags/v5 and v5.6.0 resolve to this commit.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Neovim 0.12.6
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz -o /tmp/nvim.tar.gz
          printf '%s  %s\n' '474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87' /tmp/nvim.tar.gz | sha256sum -c -
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo /tmp/nvim-linux-x86_64/bin >> "$GITHUB_PATH"
      - name: Fetch manifest-pinned upstream archives
        run: |
          python3 - <<'PYFETCH'
          import io, json, tarfile, urllib.request
          from pathlib import Path
          manifest = json.loads(Path('manifests/upstreams.json').read_text())
          selected = {name: manifest['upstreams'][name] for name in ('which-key', 'telescope', 'lazy.nvim', 'nvim-tree', 'nvim-cmp', 'nvim-dap', 'nvim-dap-ui')}
          selected.update(manifest['test_dependencies'])
          for name, item in selected.items():
              destination = Path('/tmp/nvim-zh-smoke') / ('lazy' if name == 'lazy.nvim' else name)
              destination.mkdir(parents=True)
              url = item['repository'] + '/archive/' + item['commit'] + '.tar.gz'
              with urllib.request.urlopen(url, timeout=60) as response:
                  archive = tarfile.open(fileobj=io.BytesIO(response.read()), mode='r:gz')
              for member in archive.getmembers():
                  parts = Path(member.name).parts[1:]
                  if parts:
                      member.name = str(Path(*parts))
                      archive.extract(member, destination, filter='data')
          PYFETCH
      - name: Run fixed upstream contracts
        run: make test-upstream
        env:
          NVIM_ZH_TEST_WHICH_KEY: /tmp/nvim-zh-smoke/which-key
          NVIM_ZH_TEST_TELESCOPE: /tmp/nvim-zh-smoke/telescope
          NVIM_ZH_TEST_PLENARY: /tmp/nvim-zh-smoke/plenary
          NVIM_ZH_TEST_LAZY: /tmp/nvim-zh-smoke/lazy
          NVIM_ZH_TEST_NVIM_TREE: /tmp/nvim-zh-smoke/nvim-tree
          NVIM_ZH_TEST_NVIM_CMP: /tmp/nvim-zh-smoke/nvim-cmp
          NVIM_ZH_TEST_NVIM_DAP: /tmp/nvim-zh-smoke/nvim-dap
          NVIM_ZH_TEST_NVIM_DAP_UI: /tmp/nvim-zh-smoke/nvim-dap-ui
          NVIM_ZH_TEST_NVIM_NIO: /tmp/nvim-zh-smoke/nvim-nio
