# 术语约束只供离线检查；运行时不会执行全局替换。
[[term]]
source = "Buffer"
policy = "preserve"
forbidden = ["缓冲区"]

[[term]]
source = "Window"
policy = "preserve"
forbidden = ["窗口"]

[[term]]
source = "Register"
policy = "preserve"
forbidden = ["寄存器"]
# CodeLLDB exposes CPU registers, and clangd capitalizes C/CPU/HLSL register diagnostics.
exclude = [
  { domain = "nvim-dap-view", contexts = ["codelldb_scope", "codelldb_register"] },
  { domain = "clangd", contexts = ["diagnostic", "related_diagnostic"] },
]

[[term]]
source = "target triple"
domain = "clang"
policy = "translate"
forbidden = ["目标三元数组"]

[[term]]
source = "null pointer"
domain = "clang-tidy"
policy = "translate"
forbidden = ["零指针"]
